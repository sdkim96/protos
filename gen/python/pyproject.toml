[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdkim96-protos"
version = "0.1.0"
description = "Generated Python protobuf bindings for github.com/sdkim96/protos"
requires-python = ">=3.9"
dependencies = ["protobuf>=5", "googleapis-common-protos>=1.65"]

[tool.setuptools.packages.find]
include = ["identity*", "knowledge*"]
