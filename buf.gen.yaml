# For details on buf.gen.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2
managed:
  enabled: true
  disable:
    # google/api/*.proto already has its own go_package; our prefix override
    # would otherwise clobber it and break the build.
    - module: buf.build/googleapis/googleapis
      file_option: go_package_prefix
  override:
    - file_option: go_package_prefix
      value: github.com/sdkim96/protos/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/python:v35.1
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi:v35.1
    out: gen/python
