syntax = "proto3";

package proto.knowledge.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

// Source represents a pointer to a single data source, which points to any type of following objects:
//  - File (knowledge.api.sdkim96.com/File)
//  - FileUrl
//  - Note
//
// Each object has different lifecycle and operation time, so they can't guarantee durability for clients.
// Source object, on the other hand, gurantees the storability, full-reachability and ownership to the data source for its workspace members and the [knowledge.api.sdkim96.com] service.
//
// Every field in this object is uneditable.
message Source {
  option (google.api.resource) = {
    type: "knowledge.api.sdkim96.com/Source"
    pattern: "workspaces/{workspace}/sources/{source}"
    singular: "source"
    plural: "sources"
  };
  // name is a fully qualified name of this object. It includes the workspace path at front of the name.
  // for example, "workspaces/w1/sources/my-source"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // ref is an explict refrence to one of the files/fileUrls/notes object.
  // For example, "workspaces/w1/files/f1"
  string ref = 2 [(google.api.field_behavior) = REQUIRED];

  // download_uri is the key to download the data source.
  // It could be reachable by the system through the HTTP GET operation.
  // For example, "https://sdkim96.com/objects/my-object"
  string download_uri = 4 [(google.api.field_behavior) = REQUIRED];
  string mime_type = 5 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string created_by = 7 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "identity.api.sdkim96.com/Account"}
  ];
  google.protobuf.Timestamp delete_time = 8 [(google.api.field_behavior) = OPTIONAL];
  string deleted_by = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "identity.api.sdkim96.com/Account"}
  ];
}
