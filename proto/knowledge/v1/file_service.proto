syntax = "proto3";

package proto.knowledge.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "proto/knowledge/v1/file.proto";

// GetFileRequest reads a single file.
message GetFileRequest {
  // name is the identifier of the file.
  // For example, "workspaces/w1/files/f1"
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "knowledge.api.sdkim96.com/File"}
  ];
}

// FileService reads files in a workspace.
service FileService {
  // GetFile returns a file, including its current state.
  rpc GetFile(GetFileRequest) returns (File) {
    option (google.api.http) = {get: "/v1/{name=workspaces/*/files/*}"};
  }
}
