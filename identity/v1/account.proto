syntax = "proto3";

package identity.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

message Account {
  option (google.api.resource) = {
    type: "identity.api.sdkim96.com/Account"
    pattern: "accounts/{account}"
  };
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string email = 2 [(google.api.field_behavior) = REQUIRED];
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
  string password = 4 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OPTIONAL];
  google.protobuf.Timestamp delete_time = 7 [(google.api.field_behavior) = OPTIONAL];
}
