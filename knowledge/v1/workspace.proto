syntax = "proto3";

package knowledge.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

// Workspace represents an isolated namespace that handles data lifecycle and ownership.
// An account object[identity.api.sdkim96.com/Account] can create a workspace. It becomes the owner of this workspace.
// Owner manages the workspace and has full authority to control data-related resources and account set and policies.
// Several accounts can be invited to the workspace to collaborate and manage data-related resources.
message Workspace {
  option (google.api.resource) = {
    type: "knowledge.api.sdkim96.com/Workspace"
    pattern: "workspaces/{workspace}"
    singular: "workspace"
    plural: "workspaces"
  };
  // name is a fully qualified name of this object.
  // for example, "workspaces/w1"
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  string description = 3 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string created_by = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "identity.api.sdkim96.com/Account"}
  ];
  google.protobuf.Timestamp delete_time = 6 [(google.api.field_behavior) = OPTIONAL];
  string deleted_by = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "identity.api.sdkim96.com/Account"}
  ];
}
